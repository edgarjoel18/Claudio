tasks:
 db_path: .claudio/tasks.db

llm:
 provider: openai
 model: gpt-4o
 judge_model: gpt-4o-mini   # cheaper model used only for LLM-as-judge

skills:
 skills_dir: .claudio/skills

memory:
 db_path: .memory/memory.db
 summarize_at_tokens: 4000
 keep_last_messages: 20

rag:
 mode: hybrid           # semantic | hybrid

vector_store:
 provider: qdrant
 retrieval_mode: hybrid  # dense | sparse | hybrid

qdrant:
 collection_name: codebase

chromadb:
 persist_dir: .chromadb/
 collection_name: codebase

elasticsearch:
 url: http://localhost:9200
 index_name: codebase

embeddings:
 provider: openai
 model: text-embedding-3-small
 dims: 1536

semantic_cache:
 enabled: true
 redis_url: redis://localhost:6379
 threshold: 0.85
 ttl: 86400
