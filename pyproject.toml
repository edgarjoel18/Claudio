[project]
name = "c-cli"
version = "0.1.0"
description = "A powerful custom command-line interface tool"
authors = [ {name = "Edgar Catalan"} ]
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "openai>=2.44.0",
    "chromadb>=0.5.0",
    "onnxruntime>=1.23.0,<1.24.0",
    "fastembed (>=0.7.4,<0.8.0)",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.12,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.3.4,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.4.8,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<8.0.0)",
    "redisvl (>=0.23.0,<0.24.0) ; python_version >= \"3.12\" and python_version < \"3.15\""
]

[tool.poetry]
packages = [{include = "claudio"}]

[tool.poetry.scripts]
claudio = "claudio.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
